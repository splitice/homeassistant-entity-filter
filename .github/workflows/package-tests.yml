name: package-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: homeassistant-entity-filter/package-lock.json

      - name: Install dependencies
        working-directory: homeassistant-entity-filter
        run: npm ci --no-audit --no-fund

      - name: Run package tests
        working-directory: homeassistant-entity-filter
        run: npm test
